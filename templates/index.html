<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Support AI Agent</title>


<style>

*{
    box-sizing:border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}


body{

    margin:0;
    height:100vh;
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;

}



.chat-container{

    width:420px;
    height:650px;
    background:white;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    display:flex;
    flex-direction:column;
    overflow:hidden;

}




.header{

    background:#2563eb;
    color:white;
    padding:18px;
    display:flex;
    align-items:center;

}



.bot-image{

    width:45px;
    height:45px;
    border-radius:50%;
    background:white;
    color:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    margin-right:12px;

}



.header h2{

    margin:0;
    font-size:18px;

}


.status{

    font-size:12px;
    opacity:0.9;

}




.chat-box{

    flex:1;
    padding:15px;
    overflow-y:auto;
    background:#f8fafc;

}



.message{

    display:flex;
    margin-bottom:15px;

}



.message.bot{

    justify-content:flex-start;

}



.message.user{

    justify-content:flex-end;

}




.avatar{

    width:35px;
    height:35px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:5px;

}



.bot-avatar{

    background:#2563eb;
    color:white;

}



.user-avatar{

    background:#16a34a;
    color:white;

}




.bubble{

    max-width:75%;
    padding:12px 15px;
    border-radius:18px;
    font-size:14px;
    line-height:1.4;

}



.bot .bubble{

    background:white;
    border:1px solid #ddd;

}



.user .bubble{

    background:#2563eb;
    color:white;

}




.quick-buttons{

    padding:10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    background:white;

}



.quick-buttons button{

    border:none;
    background:#e0e7ff;
    color:#1e40af;
    padding:8px 12px;
    border-radius:20px;
    cursor:pointer;

}



.input-area{

    display:flex;
    padding:12px;
    border-top:1px solid #ddd;

}



.input-area input{

    flex:1;
    padding:12px;
    border-radius:25px;
    border:1px solid #ccc;
    outline:none;

}



.input-area button{

    margin-left:8px;
    border:none;
    background:#2563eb;
    color:white;
    padding:12px 18px;
    border-radius:25px;
    cursor:pointer;

}



.typing{

    font-style:italic;
    color:#777;

}



</style>

</head>



<body>


<div class="chat-container">


<div class="header">

<div class="bot-image">
🤖
</div>

<div>

<h2>
Customer Support AI Agent
</h2>

<div class="status">
Online ●
</div>

</div>

</div>



<div id="chatBox" class="chat-box">


<div class="message bot">


<div class="avatar bot-avatar">
🤖
</div>


<div class="bubble">

Hello! Welcome to Customer Support AI Agent.
<br><br>

I can help you with:

<br>
• Order Tracking
<br>
• Payment Issues
<br>
• Refund Requests
<br>
• Account Problems

</div>


</div>


</div>



<div class="quick-buttons">

<button onclick="quickSend('Track my order')">
Track Order
</button>


<button onclick="quickSend('Payment failed')">
Payment Issue
</button>


<button onclick="quickSend('I want refund')">
Refund
</button>


<button onclick="quickSend('Forgot my password')">
Login Help
</button>


</div>




<div class="input-area">


<input 
id="messageInput"
placeholder="Type your message..."
onkeypress="if(event.key==='Enter') sendMessage()"
>


<button onclick="sendMessage()">
Send
</button>


</div>



</div>





<script>


let userId = localStorage.getItem(
    "customer_ai_user"
);



if(!userId){

    userId = crypto.randomUUID();

    localStorage.setItem(
        "customer_ai_user",
        userId
    );

}



function addMessage(text,type){


    let chatBox=document.getElementById(
        "chatBox"
    );


    let message=document.createElement(
        "div"
    );


    message.className=
        "message "+type;



    let avatar =
        type==="bot"
        ? "🤖"
        : "👤";



    message.innerHTML=`

    <div class="avatar ${type==="bot" ? "bot-avatar":"user-avatar"}">
    ${avatar}
    </div>


    <div class="bubble">
    ${text}
    </div>

    `;



    chatBox.appendChild(message);


    chatBox.scrollTop=
        chatBox.scrollHeight;


}




async function sendMessage(){


    let input = document.getElementById(
        "messageInput"
    );


    let message = input.value.trim();


    if(!message)
        return;


    addMessage(
        message,
        "user"
    );


    input.value = "";


    let typing = document.createElement(
        "div"
    );


    typing.className = "typing";


    typing.innerHTML =
        "🤖 Typing...";


    document.getElementById(
        "chatBox"
    ).appendChild(typing);



    try {


        let response = await fetch(
            "/chat",
            {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },


                body: JSON.stringify({

                    message: message,

                    user_id: userId

                })

            }
        );



        let data = await response.json();



        typing.remove();



        addMessage(

            data.response,

            "bot"

        );


    }


    catch(error){


        typing.remove();


        addMessage(

            "Sorry, something went wrong. Please try again.",

            "bot"

        );


        console.log(error);


    }


}

function quickSend(text){

    document.getElementById(
        "messageInput"
    ).value = text;


    sendMessage();


}

</script>



</body>

</html>
